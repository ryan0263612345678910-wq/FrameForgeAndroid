
name: Build Editron APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Editron_Project_Com_Icon.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Editron
        run: |
          unzip -o Editron_Project_Com_Icon.zip -d .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Editron-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
